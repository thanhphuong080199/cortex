# Mục 3 ("sửa 1 note trên web, đợi sync, tìm từ CŨ → không ra kết quả") and the one case in
# mục 2 that is not about the app lock ("xóa vĩnh viễn 1 note trên web → biến mất khỏi điện
# thoại") used to be proved here, through the note list. The list is gone (S1 §1), and neither
# case has a surface left to assert through: nothing in the chat UI can show that a note's body
# changed or that a row was hard-deleted. What survives is the property both cases were really
# testing -- a server-side write reaching the device on its own -- asserted one table over, since
# chat_messages now replicates too (S1 §4).
#
# Still the flow most likely to catch the open sync bug, and the one that is meaningless if
# PowerSync is not actually running. If this times out, check the powersync container before the
# app.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    file: subflows/dismiss-dev-launcher.yaml
- runFlow: subflows/install-session.yaml
- runFlow: subflows/wait-for-download.yaml

# Server->device replication, asserted through the transcript.
#
# This used to be proved by editing a note on the server and watching the note LIST update.
# The list is gone (S1 §1), and chat_messages now replicates (S1 §4) -- so the same property is
# asserted one table over. If this times out, check the powersync container before the app: a
# dead download stream looks exactly like a broken screen from here.
- runScript:
    file: scripts/server-seed-chat-message.js
    env:
      CONTENT: "REPLICATEDFROMSERVER"

# It has to arrive on its own. No pull-to-refresh, no relaunch: useQuery is reactive, and
# needing a nudge here would itself be the bug.
- extendedWaitUntil:
    visible: "REPLICATEDFROMSERVER"
    timeout: 90000

# And it must survive a relaunch -- i.e. it reached local SQLite rather than a component's state.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    file: subflows/dismiss-dev-launcher.yaml
- extendedWaitUntil:
    visible: "REPLICATEDFROMSERVER"
    timeout: 60000
