# Mục 1 — first sign-in, and the download stream.
#
# THE ASSERTION THIS FLOW EXISTS FOR
#
# The phase-1b handoff records that `connected=true` was never once observed on a real device,
# while uploads worked. If that is a live bug, the `wait-for-download` step here is what fails:
# "haha ok chitchat seeded turn" was written by the seed script straight to Postgres and has
# never existed on this device, so it can only appear by arriving over the sync stream.
#
# WHAT IT DOES NOT PROVE. This runs on an emulator with clean host networking -- no Doze, no
# cell handover, no captive portal. Green here does not mean the real-device symptom is fixed;
# it means the stream works when the network is not the problem. Closing that issue still needs
# one manual run on hardware.
appId: ${APP_ID}
---
# clearState so this really is a first launch: no local database, no cached session.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    file: subflows/dismiss-dev-launcher.yaml

# Signed out, on the door screen.
#
# There used to be an `assertNotVisible: "Cortex đang khoá"` here, checking that
# EXPO_PUBLIC_E2E=1 had reached the build by proving the biometric lock was off. The lock was
# dropped on 2026-08-25 (68b618c) and components/app-lock-gate.tsx went with it, so that line
# had been asserting the absence of copy that exists nowhere -- passing unconditionally, which
# is exactly the rot its own comment warned about. Removed rather than repointed.
#
# The flag is still checked, one step later and by something that cannot pass without it:
# `subflows/install-session.yaml` opens `cortex://e2e-session?...`, and app/e2e-session.tsx
# refuses the deep link unless IS_E2E_BUILD is true. A build missing the flag fails there.
- assertVisible: "Sign in with Google"

- runFlow: subflows/install-session.yaml
- runFlow: subflows/wait-for-download.yaml

# The rest of the seeded corpus, to prove the stream delivered the whole bucket and not just the
# first row. Rewritten 2026-08-22 alongside the note list's removal (final whole-branch review
# finding): this used to scrollUntilVisible two note titles ("Apostrophe note", "Edit target")
# that chat.tsx cannot render at all -- it shows chat_messages, never notes. seed.mjs's seeded
# turn has two rows (seedCorpus); the assistant half is the second one, so asserting it is
# visible proves the whole pair arrived, not just the first. No scroll needed: two rows never
# overflow the viewport the way a six-row note list did.
- assertVisible: "Hehe, seeded assistant reply."

# Sign-out lives in the header now (index.tsx's headerRight), not a list footer -- no scroll
# needed to reach it. Wipes the local corpus BEFORE clearing the Supabase session (lib/auth.ts),
# so a failed wipe must not read as a clean sign-out.
- tapOn:
    id: "sign-out"

- extendedWaitUntil:
    visible: "Sign in with Google"
    timeout: 30000

# That the local database file is actually gone is asserted in the workflow with
# `adb shell run-as`, not here -- Maestro can only see the screen, and "the list is empty"
# is exactly the symptom a zero-height list produced once before while every row was present.
