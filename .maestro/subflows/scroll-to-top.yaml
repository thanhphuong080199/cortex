# Parks the home screen's one scrolling surface at the very top.
#
# WHY EVERY FLOW NEEDS THIS. NoteList is the only thing on the screen that scrolls -- capture,
# check-in, media log, the search box, the view chips, the rows and the footer are all inside it
# (screens/note-list.tsx explains why) -- and its header alone is taller than any phone's
# viewport. So nothing below the check-in widget is ever on screen without scrolling, and
# `scrollUntilVisible` starts from wherever the previous command left the view. A DOWN scroll for
# something that is now ABOVE the view runs to the end of the list and fails, which is how a
# flow ends up timing out on a row that is present, rendered and one swipe away.
#
# Coming back here first makes every following DOWN scroll correct by construction: nothing on
# this screen sits above the capture box.
#
# The assistant box's testID rather than its placeholder text: the placeholder is
# gone the moment anything is typed into the box, and half the flows type into it.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: "box-input"
    direction: UP
    timeout: 30000
