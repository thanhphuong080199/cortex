# Waits until the seeded corpus has arrived from the server.
#
# This is the UI form of the question the phase-1b handoff leaves open: `connected=true` was
# never observed on a real device, and if the download stream is dead this is the assertion that
# fails. A note the device never wrote appearing in the list is proof the stream delivered --
# it cannot come from anywhere else.
#
# 90s because the first sync of a fresh bucket includes PowerSync compiling the sync rules and
# doing an initial replication pass; steady-state arrivals are seconds.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "Zarquon note"
    timeout: 90000
