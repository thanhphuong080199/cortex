# Waits until the seeded corpus has arrived from the server.
#
# This is the UI form of the question the phase-1b handoff leaves open: `connected=true` was
# never observed on a real device, and if the download stream is dead this is the assertion that
# fails. "haha ok chitchat seeded turn" is a chat_messages row e2e/scripts/seed.mjs writes
# straight to Postgres (its seedCorpus function) that this device never wrote, so it can only
# appear by arriving over the sync stream -- the same property "Zarquon note" proved through the
# note list before S1 removed both the list and notes' place on this screen (chat.tsx renders
# chat_messages only, never notes -- see its own 2026-08-22 comment).
#
# extendedWaitUntil, not scrollUntilVisible: unlike the old NoteList, Chat's header is just the
# ConnectionPill, and the seeded corpus here is two rows -- nothing hides this row off-screen.
#
# 90s because the first sync of a fresh bucket includes PowerSync compiling the sync rules and
# doing an initial replication pass; steady-state arrivals are seconds.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "haha ok chitchat seeded turn"
    timeout: 90000
