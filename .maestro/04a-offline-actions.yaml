# Mục 4 — everything done while the device is offline, in one pass.
#
# The radios are turned off BEFORE this flow and back on before 04b, by e2e/scripts/run-maestro.sh.
# Maestro has no command for that. Splitting the flow is better than the alternative -- a
# runScript shelling out to adb -- because `runScript` executes on the HOST, and that same
# property is what lets a server-side write happen while the phone is offline (see 03).
#
# `clearState: false`: this inherits the local database 03 left behind, already populated from
# the sync stream.
#
# Retired on 2026-08-22 with the screens that made them possible: offline trash/restore, the
# editor's debounce, the FTS5 apostrophe case, and the conflict run. The conflict run is not
# merely unasserted -- with no note editor, no device-side edit exists to conflict WITH, so the
# scenario cannot be constructed. notes/service.ts's server-side resolution keeps its unit
# tests. The apostrophe case keeps lib/fts.ts's.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    file: subflows/dismiss-dev-launcher.yaml

# ---- 9. the pill goes offline ----
# The negative half of 02's assertion. If this still says "Trực tuyến", either the radios did
# not go down or PowerSync has not noticed, and nothing below means anything.
- extendedWaitUntil:
    visible: "Ngoại tuyến"
    timeout: 60000

# ---- 1. capture offline ----
- tapOn:
    id: "box-input"
- inputText: ${CAPTURE_MARKER}
- tapOn:
    id: "box-send"
- assertVisible:
    id: "box-input"
    text: "Bạn đang nghĩ gì?"
# extendedWaitUntil, not a bare assertVisible (final whole-branch review finding): this text
# only exists via the live-turn overlay (no server round trip while offline, so no chat_messages
# row is ever written for it -- assert-offline-results.js proves the durable half against
# /notes). AssistantBox's `finally` no longer clears that overlay the instant the stream attempt
# fails; chat.tsx keeps it up to RETIRE_TIMEOUT_MS waiting for replication evidence that can
# never arrive here. A bare assertVisible raced that window and could fire before or after the
# overlay had a chance to settle.
- extendedWaitUntil:
    visible: ${CAPTURE_MARKER}
    timeout: 3000

# ---- 5. double-tap Send ----
# The in-flight guard has to collapse this to ONE note; `disabled={busy}` cannot, because state
# updates are async and two taps in one frame both read busy === false. Counted server-side in
# 04b by assert-offline-results.js; this only creates the condition.
- tapOn:
    id: "box-input"
- inputText: ${DOUBLE_TAP_MARKER}
- doubleTapOn:
    id: "box-send"

# ---- 8. offline, the box answers from the local index ----
# THE ONE THAT NOW CARRIES THE MOST WEIGHT. With no note list, this is the only remaining proof
# that notes actually reached local SQLite: offlineAnswer() reads the device's own FTS index,
# so a hit here cannot come from the network.
- tapOn:
    id: "box-input"
- inputText: "định giá"
- tapOn:
    id: "box-send"
- extendedWaitUntil:
    visible:
      id: "box-status"
    timeout: 5000
- assertVisible:
    id: "box-offline-match"
