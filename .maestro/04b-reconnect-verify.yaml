# Mục 4, after the radios come back. Verifies on the device what 04a did, then hands the
# countable parts to a host-side script.
#
# `clearState: false` is load-bearing: this flow needs 04a's local database, including its
# undrained upload queue.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    file: subflows/dismiss-dev-launcher.yaml

# Nothing below means anything until the device says it is connected again. Generous: a cold
# reconnect has to re-establish the stream AND drain the queue 04a filled.
- extendedWaitUntil:
    visible: "Trực tuyến"
    timeout: 180000

# The UI-level "the offline capture survived the round trip" check that used to live here is
# gone (final whole-branch review finding, removed 2026-08-22): it waited for ${CAPTURE_MARKER}
# to reappear in the transcript, which it structurally cannot -- an offline capture is a `notes`
# INSERT only, no assistant turn ever runs for it, so no `chat_messages` row is ever written and
# this always timed out. `assert-offline-results.js` below is the actual proof this step wanted:
# it polls PostgREST for the `notes` row itself (id, created_at), which is where the capture
# really landed.
#
# ---- everything that can only be counted ----
- runScript:
    file: scripts/assert-offline-results.js
