name: Post-merge

# Everything slow, after the merge rather than on the pull request.
#
# A PR is gated by `CI gate` alone (ci.yml) -- build, typecheck, lint, unit and db tests, about
# three minutes. The E2E suites and the APK build run here instead, because the mobile suite
# alone is ~40-55 minutes cold (~20-28 warm) and that is most of an hour on every round trip.
#
# THE TRADE, recorded so it is a decision rather than an accident: `main` is now where E2E
# breakage is discovered, and where it gets fixed. The phase-1b branch spent eleven fix(e2e)
# commits converging the Maestro suite; under this arrangement all eleven would have landed on
# main.
on:
  push:
    branches: [main]

concurrency:
  group: post-merge-${{ github.ref }}
  # NOT cancel-in-progress. Every push to main shares this group, so cancelling would let a
  # docs-only commit kill the in-flight APK build of the commit before it -- and then build
  # nothing itself, because its own apk filter is false. Neither commit produces an APK.
  # Queueing is the cost of never silently losing one.
  cancel-in-progress: false

jobs:
  # The path filters that used to live in each workflow's `on.push.paths`. They had to move:
  # path filtering is workflow-scoped, so it cannot gate one job among several, and gating the
  # APK on the suites requires them to be jobs in one workflow.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      apk: ${{ steps.filter.outputs.apk }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'packages/sync/**'
              - 'packages/core/**'
              - 'supabase/migrations/**'
              - 'e2e/**'
              - '.maestro/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/e2e-mobile.yml'
              - '.github/workflows/post-merge.yml'
            apk:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'packages/sync/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/android-apk.yml'
              - '.github/workflows/post-merge.yml'
            api:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'supabase/migrations/**'
              - 'pnpm-lock.yaml'
              - 'apps/api/Dockerfile'
              - '.github/workflows/post-merge.yml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/post-merge.yml'

  # Unfiltered, as it was before: it finishes in about three minutes, and a change to
  # packages/shared or packages/core can break the web app without touching apps/web at all.
  e2e-web:
    name: E2E Web
    uses: ./.github/workflows/e2e-web.yml

  e2e-mobile:
    name: E2E Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/e2e-mobile.yml

  # `always()` PLUS an explicit assertion on each result is mandatory, not defensive.
  #
  # Without `always()`, a SKIPPED dependency skips this job too -- so a docs-only push, which
  # correctly skips e2e-mobile, would silently stop building APKs forever. With `always()` and
  # no result checks, the opposite: a FAILING suite would still ship an APK. Both halves are
  # required, and `CI gate` in ci.yml already uses this exact idiom.
  #
  # `|| result == 'skipped'` on e2e-mobile covers one real case: the APK's path set is a subset
  # of the mobile suite's EXCEPT for android-apk.yml itself. Editing that file alone must build
  # an APK while legitimately skipping the suite.
  #
  # Gating on e2e-web is a deliberate reading of "if everything passes, build the APK". The
  # coupling is arguable -- a web regression says nothing about an Android artifact -- and
  # undoing it is deleting one line.
  apk:
    name: Android APK
    needs: [changes, e2e-web, e2e-mobile]
    if: >-
      always()
      && needs.changes.outputs.apk == 'true'
      && needs.e2e-web.result == 'success'
      && (needs.e2e-mobile.result == 'success' || needs.e2e-mobile.result == 'skipped')
    uses: ./.github/workflows/android-apk.yml

  # Deploy gate is e2e-web alone, not e2e-mobile: these two ship the API and the web app, and
  # neither depends on the mobile suite being green. A plain `needs: [changes, e2e-web]` (no
  # `always()`) already does the right thing here -- if e2e-web fails or is skipped, both deploy
  # jobs are skipped too, unlike `apk` above which has to tell a legitimately-skipped mobile
  # suite apart from a failing one.
  #
  # Migrations are NOT part of this pipeline. `supabase db push` stays a deliberate, manual step
  # (docs/deploy.md's "Is there CI/CD?" section) -- a bad migration must never apply itself just
  # because the code that needs it happened to pass E2E.
  #
  # Moved off Railway (trial expired 2026-08-31) onto Cloud Run in the same GCP project that
  # holds the $300 credit (gen-lang-client-0466664043, ap-southeast/asia-southeast1 to stay next
  # to the Supabase project in Singapore). Auth is Workload Identity Federation -- no static key
  # in GitHub secrets -- scoped to this repo only (see the attribute-condition on the WIF
  # provider). Only the four secrets below are real secrets; SUPABASE_URL and the budget/tier
  # values are not (same reasoning as VERCEL_ORG_ID/PROJECT_ID below: identifiers, not credentials).
  deploy-api:
    name: Deploy API (Cloud Run)
    needs: [changes, e2e-web]
    if: needs.changes.outputs.api == 'true' && needs.e2e-web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: gen-lang-client-0466664043
      REGION: asia-southeast1
      IMAGE: asia-southeast1-docker.pkg.dev/gen-lang-client-0466664043/cortex/cortex-api
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/939227979983/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@gen-lang-client-0466664043.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t "$IMAGE:${{ github.sha }}" .
      - name: Push image
        run: docker push "$IMAGE:${{ github.sha }}"
      - name: Write env vars file
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/env-vars.yaml <<EOF
          SUPABASE_URL: "https://wilssluxogpdrbgffmzc.supabase.co"
          SUPABASE_ANON_KEY: "$SUPABASE_ANON_KEY"
          SUPABASE_SERVICE_ROLE_KEY: "$SUPABASE_SERVICE_ROLE_KEY"
          DATABASE_URL: "$DATABASE_URL"
          GEMINI_API_KEY: "$GEMINI_API_KEY"
          GEMINI_TIER: "paid"
          ENRICH_MONTHLY_BUDGET_USD: "10"
          ASSISTANT_MONTHLY_BUDGET_USD: "10"
          EOF
      - name: Deploy
        run: |
          gcloud run deploy cortex-api \
            --image="$IMAGE:${{ github.sha }}" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --platform=managed \
            --allow-unauthenticated \
            --port=3001 \
            --env-vars-file=/tmp/env-vars.yaml
      - name: Clean up env file
        if: always()
        run: rm -f /tmp/env-vars.yaml

  deploy-web:
    name: Deploy Web (Vercel)
    needs: [changes, e2e-web]
    if: needs.changes.outputs.web == 'true' && needs.e2e-web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel
      # No `working-directory: apps/web` here: the Vercel project itself has
      # rootDirectory: "apps/web" (apps/web/.vercel/project.json), which the CLI applies
      # relative to cwd. Running from apps/web made it look for apps/web/apps/web and fail
      # every post-merge deploy with "provided path ... does not exist".
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_AvkhehlsdMcvoLJql9c2fUH0
          VERCEL_PROJECT_ID: prj_s4LpM7MTeXIzvHrEAC3v8BVYleYg
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
