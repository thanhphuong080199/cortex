name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: build, typecheck, lint, shared tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build typecheck lint

      # @cortex/db and @cortex/api need a live Supabase stack, so their tests run only in
      # the db-tests job below; here we unit-test the one package that needs no external
      # services. `--filter` keeps that boundary: turbo's `test` -> `^build` edge pulls in
      # only this package's own dependency builds (@cortex/config#build,
      # @cortex/shared#build), never another package's `test`. Same rule as the db-tests
      # job — always the turbo form, never `pnpm --filter @cortex/shared test`, which
      # bypasses the graph and tests whatever stale dist/ is lying around (issue log
      # A7/B5/E8).
      - run: pnpm turbo run test --filter=@cortex/shared

      - name: Test @cortex/sync
        run: pnpm turbo run test --filter=@cortex/sync

  db-tests:
    name: db + api tests (against local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Use the Supabase CLI pinned in package.json (devDependency) rather than
      # supabase/setup-cli@v1, so CI runs the exact CLI version validated locally
      # (`pnpm exec supabase --version`). That parity is the whole reason the CLI is a
      # pinned devDependency instead of a global tool — `supabase status -o env` key
      # names and the JWT format issued by `supabase start` have both changed across
      # CLI versions, so drifting the CI version independently of the lockfile would
      # silently invalidate the assumptions the tests below depend on.
      #
      # Exclude services the test suites never touch (storage, realtime, studio, the
      # edge runtime, analytics/logflare, postgres-meta, vector, mailpit) to cut
      # `supabase start` time — only postgres, gotrue (auth), postgrest (rest) and kong
      # (api gateway) are needed to sign users in and hit the REST/Nest APIs under test.
      - name: Start Supabase local stack
        run: >
          pnpm exec supabase start
          -x realtime,storage-api,studio,edge-runtime,logflare,vector,postgres-meta,mailpit

      # `supabase status -o env` wraps every value in double quotes (e.g.
      # API_URL="http://127.0.0.1:54321"); those literal quotes must be stripped before
      # writing to $GITHUB_ENV, otherwise downstream env vars end up with quote
      # characters baked into the URL/JWT strings.
      #
      # Deliberately do NOT export SUPABASE_JWT_SECRET: as of Supabase CLI 2.x,
      # `supabase start` issues asymmetric (ES256) access tokens even though
      # `supabase status` still reports a legacy HS256 JWT_SECRET for backward
      # compatibility. That legacy secret does not verify real tokens. Leaving it
      # unset makes apps/api's SupabaseAuthGuard fall through to the JWKS verification
      # path (see apps/api/src/auth/supabase-auth.guard.ts), which is also what
      # production uses — so CI exercises the real code path, not a shortcut.
      - name: Export local Supabase keys as app env vars
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Every vitest config sets `setupFiles: ["dotenv/config"]`, so a `.env` sitting in a
      # package directory is loaded into the test process and silently backfills anything
      # missing from the real environment. Developers have those files locally (gitignored);
      # CI must not, or it stops testing the path production and this workflow actually use.
      # That difference is exactly what hid the turbo strict-env-mode bug in E8: locally
      # dotenv refilled SUPABASE_*, so the suites passed, and only CI — with no `.env` —
      # failed. If a `.env` ever reaches a runner, these suites would start passing for the
      # wrong reason, so fail loudly instead.
      - name: Assert no .env files (they would mask missing turbo env declarations)
        run: |
          found=$(find . -name .env -not -path '*/node_modules/*')
          if [ -n "$found" ]; then
            echo "::error::.env file(s) present on the runner; CI must rely on real env vars, not dotenv:"
            echo "$found"
            exit 1
          fi

      # ALWAYS `turbo run test --filter=...`, never `pnpm --filter ... test`:
      # @cortex/shared and @cortex/core are consumed as compiled dist/, and only turbo's
      # `test` -> `^build` dependency rebuilds them first. The pnpm-filtered form tests
      # against whatever stale dist/ happens to be lying around, which reads as "my edit
      # didn't take" (issue log A7/B5).
      - name: Run db tests (includes the RLS cross-user isolation suite)
        run: pnpm turbo run test --filter=@cortex/db

      - name: Run api tests
        run: pnpm turbo run test --filter=@cortex/api

      - name: Run core tests (NoteService / TagService / ExportService against RLS)
        run: pnpm turbo run test --filter=@cortex/core
