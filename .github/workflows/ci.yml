name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: build, typecheck, lint, stack-free tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build typecheck lint

      # @cortex/db and @cortex/api need a live Supabase stack, so their tests run only in
      # the db-tests job below; here we unit-test the one package that needs no external
      # services. `--filter` keeps that boundary: turbo's `test` -> `^build` edge pulls in
      # only this package's own dependency builds (@cortex/config#build,
      # @cortex/shared#build), never another package's `test`. Same rule as the db-tests
      # job — always the turbo form, never `pnpm --filter @cortex/shared test`, which
      # bypasses the graph and tests whatever stale dist/ is lying around (issue log
      # A7/B5/E8).
      - run: pnpm turbo run test --filter=@cortex/shared

      - name: Test @cortex/sync
        run: pnpm turbo run test --filter=@cortex/sync

      # apps/mobile's suites mock every native module (expo-secure-store et al) and touch
      # no Supabase stack, so they belong here rather than in db-tests. Every later
      # mobile suite lands in this same run, so this step is what keeps them in CI at all.
      - name: Test @cortex/mobile
        run: pnpm turbo run test --filter=@cortex/mobile

      # The only step that loads modules the way the DEVICE does. tsc accepts NodeNext's
      # `./x.js` suffix and vitest resolves it too, but Metro looks for a file of that name and
      # fails -- so apps/mobile was unbundlable from Task 13 onward while typecheck, lint and
      # every test stayed green, and the first thing to notice was an EAS build 20 minutes in.
      - name: Bundle @cortex/mobile
        run: pnpm turbo run bundle --filter=@cortex/mobile

      # apps/web's suite needs no Supabase stack either, and until this step existed it ran
      # nowhere but a developer's machine: `build typecheck lint` cover web, but the `test`
      # task is filtered per package in both jobs, so a broken assertion in note-views.test.ts
      # was green in CI indefinitely. Same rule that caught @cortex/sync and apps/mobile.
      - name: Test @cortex/web
        run: pnpm turbo run test --filter=@cortex/web

  # THE ONLY JOB BRANCH PROTECTION SHOULD EVER REQUIRE.
  #
  # Required status checks are matched by the job's `name:` as a LITERAL STRING, and a required
  # context that never reports leaves the PR "Expected — waiting for status to be reported"
  # forever. That is not hypothetical: ab0a64c renamed `checks` from "…shared tests" to
  # "…stack-free tests" as a drive-by in a docs commit, protection still required the old string,
  # and every PR to main was unmergeable while all four checks showed green. Nothing about the
  # failure points at a name — the job that runs looks fine, and the one that blocks is invisible
  # in the checks list.
  #
  # Depending on this indirection instead means job names are free to change and new jobs are
  # free to appear; only THIS name is load-bearing, and it says nothing that could go stale.
  #
  # `if: always()` is required. Without it a failing dependency SKIPS this job rather than
  # failing it, and GitHub treats a skipped required check as satisfied — the gate would wave
  # through exactly the runs it exists to stop.
  #
  # Deliberately does NOT gate on the E2E workflows: both are path-filtered, so a docs-only PR
  # never reports them, which is the same never-reporting trap in a different disguise.
  gate:
    name: CI gate
    needs: [checks, db-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        run: |
          echo "checks:   ${{ needs.checks.result }}"
          echo "db-tests: ${{ needs.db-tests.result }}"
          [ "${{ needs.checks.result }}" = "success" ] || exit 1
          [ "${{ needs.db-tests.result }}" = "success" ] || exit 1

  db-tests:
    name: db + api tests (against local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Use the Supabase CLI pinned in package.json (devDependency) rather than
      # supabase/setup-cli@v1, so CI runs the exact CLI version validated locally
      # (`pnpm exec supabase --version`). That parity is the whole reason the CLI is a
      # pinned devDependency instead of a global tool — `supabase status -o env` key
      # names and the JWT format issued by `supabase start` have both changed across
      # CLI versions, so drifting the CI version independently of the lockfile would
      # silently invalidate the assumptions the tests below depend on.
      #
      # Exclude services the test suites never touch (storage, realtime, studio, the
      # edge runtime, analytics/logflare, postgres-meta, vector, mailpit) to cut
      # `supabase start` time — only postgres, gotrue (auth), postgrest (rest) and kong
      # (api gateway) are needed to sign users in and hit the REST/Nest APIs under test.
      - name: Start Supabase local stack
        run: >
          pnpm exec supabase start
          -x realtime,storage-api,studio,edge-runtime,logflare,vector,postgres-meta,mailpit

      # `supabase status -o env` wraps every value in double quotes (e.g.
      # API_URL="http://127.0.0.1:54321"); those literal quotes must be stripped before
      # writing to $GITHUB_ENV, otherwise downstream env vars end up with quote
      # characters baked into the URL/JWT strings.
      #
      # Deliberately do NOT export SUPABASE_JWT_SECRET: as of Supabase CLI 2.x,
      # `supabase start` issues asymmetric (ES256) access tokens even though
      # `supabase status` still reports a legacy HS256 JWT_SECRET for backward
      # compatibility. That legacy secret does not verify real tokens. Leaving it
      # unset makes apps/api's SupabaseAuthGuard fall through to the JWKS verification
      # path (see apps/api/src/auth/supabase-auth.guard.ts), which is also what
      # production uses — so CI exercises the real code path, not a shortcut.
      # DATABASE_URL comes from the CLI's `DB_URL` key (NOT `DATABASE_URL` -- the names differ),
      # and it is the first direct-Postgres connection string this repo needs: apps/api's
      # test/boss.integration.test.ts calls createBoss(process.env.DATABASE_URL!). Without it
      # `pg` silently falls back to its own defaults (localhost:5432) while the CLI put Postgres
      # on 54322, so beforeAll throws and both pg-boss tests fail -- a failure that reads like a
      # broken queue rather than a missing variable.
      #
      # The three GEMINI_*/ENRICH_* values are DUMMIES, and must stay dummies: NO TEST MAY EVER
      # CALL THE REAL GEMINI API (packages/core/src/ai/fake.ts). Every suite embeds through
      # createFakeAi; these exist only so apps/api's parseApiEnv (src/env.ts) can complete --
      # this branch made all four vars REQUIRED, and a ZodError at parse time aborts a test
      # before it reaches the behaviour it was written to assert. A real key here would buy
      # nothing and put a live billable credential on a public runner.
      #
      # GEMINI_TIER must be `free` next to a local SUPABASE_URL, and that pairing is the only
      # legitimate one: assertTierAllowsRealData (packages/core/src/enrich/budget.ts, spec §15.6
      # rule 2) refuses a free-tier key against a HOSTED url, because free-tier prompts are used
      # for training and this app's text is personal. Local stack + free is the combination the
      # rule exists to permit.
      - name: Export local Supabase keys as app env vars
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "GEMINI_API_KEY=ci-dummy-key-no-test-may-reach-the-real-api"
            echo "GEMINI_TIER=free"
            echo "ENRICH_MONTHLY_BUDGET_USD=5"
            echo "ASSISTANT_MONTHLY_BUDGET_USD=5"
          } >> "$GITHUB_ENV"

      # Every vitest config sets `setupFiles: ["dotenv/config"]`, so a `.env` sitting in a
      # package directory is loaded into the test process and silently backfills anything
      # missing from the real environment. Developers have those files locally (gitignored);
      # CI must not, or it stops testing the path production and this workflow actually use.
      # That difference is exactly what hid the turbo strict-env-mode bug in E8: locally
      # dotenv refilled SUPABASE_*, so the suites passed, and only CI — with no `.env` —
      # failed. If a `.env` ever reaches a runner, these suites would start passing for the
      # wrong reason, so fail loudly instead.
      - name: Assert no .env files (they would mask missing turbo env declarations)
        run: |
          found=$(find . -name .env -not -path '*/node_modules/*')
          if [ -n "$found" ]; then
            echo "::error::.env file(s) present on the runner; CI must rely on real env vars, not dotenv:"
            echo "$found"
            exit 1
          fi

      # ALWAYS `turbo run test --filter=...`, never `pnpm --filter ... test`:
      # @cortex/shared and @cortex/core are consumed as compiled dist/, and only turbo's
      # `test` -> `^build` dependency rebuilds them first. The pnpm-filtered form tests
      # against whatever stale dist/ happens to be lying around, which reads as "my edit
      # didn't take" (issue log A7/B5).
      - name: Run db tests (includes the RLS cross-user isolation suite)
        run: pnpm turbo run test --filter=@cortex/db

      - name: Run api tests
        run: pnpm turbo run test --filter=@cortex/api

      - name: Run core tests (NoteService / TagService / ExportService against RLS)
        run: pnpm turbo run test --filter=@cortex/core
