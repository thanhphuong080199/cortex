name: E2E Web

# Runs AFTER the merge, not on the pull request. Called by post-merge.yml, which chains the
# APK build behind this and the mobile suite.
#
# This suite is not the slow one -- it lands in about three minutes, against the mobile
# suite's ~40-55 minutes cold (~20-28 warm). It moved anyway, so there is ONE answer to "where
# does E2E run" rather than one per suite. `workflow_dispatch` keeps it runnable by hand
# against any branch.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: e2e-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SUPABASE_URL: http://127.0.0.1:54321
      E2E_API_URL: http://127.0.0.1:3001
      E2E_WEB_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same rule as ci.yml: every vitest config sets setupFiles: ["dotenv/config"], so a stray
      # .env silently backfills anything missing from the real environment and the suites start
      # passing for the wrong reason. CI must rely on real env vars.
      - name: Assert no .env files reached the runner
        run: |
          found=$(find . -name .env -not -path '*/node_modules/*')
          if [ -n "$found" ]; then
            echo "::error::.env file(s) present on the runner:"
            echo "$found"
            exit 1
          fi

      # DELIBERATELY KEEPS `realtime`, unlike ci.yml's db-tests job, which excludes it to save
      # start-up time. apps/web's note list is driven by postgres_changes and quick-capture.tsx
      # does no optimistic insert -- its comment is explicit that "the Realtime echo adds the
      # row". Without the container, capture.spec.ts's live case can never be un-skipped, and
      # any future spec that waits for a live update would fail with an empty list while the row
      # sat happily in Postgres. The other exclusions are services no spec touches.
      - name: Start Supabase (realtime included, on purpose)
        run: >
          pnpm exec supabase start
          -x storage-api,studio,edge-runtime,logflare,vector,postgres-meta,mailpit,imgproxy

      # `supabase status -o env` wraps every value in double quotes; those must be stripped
      # before they reach $GITHUB_ENV or the quotes end up baked into the URLs and JWTs.
      #
      # SUPABASE_JWT_SECRET is deliberately NOT exported: the CLI still reports a legacy HS256
      # secret, but `supabase start` issues asymmetric ES256 access tokens (verified -- the
      # seeded token's header is {"alg":"ES256"}), so that secret verifies nothing. Leaving it
      # unset makes apps/api's guard take the JWKS path, which is what production uses.
      # DATABASE_URL and the GEMINI_*/ENRICH_* trio are what apps/api's parseApiEnv (src/env.ts)
      # made REQUIRED in the phase 2 branch. main.ts parses them BEFORE NestFactory.create, so a
      # missing one exits(1) at boot -- the API never binds :3001 and the seed's first /notes
      # call dies with a bare `fetch failed`. ci.yml grew the same block; this file and
      # e2e-mobile.yml were missed, which is what broke the first post-merge run of that branch.
      #
      # The GEMINI_*/ENRICH_* values are DUMMIES and must stay dummies -- NO E2E RUN MAY REACH
      # THE REAL GEMINI API. GEMINI_TIER must be `free` beside a local SUPABASE_URL:
      # assertTierAllowsRealData (packages/core/src/enrich/budget.ts) refuses a free-tier key
      # against a HOSTED url, and local+free is the pairing that rule exists to permit.
      #
      # DB_URL is the CLI's key name; the app reads DATABASE_URL. The names differ.
      - name: Export Supabase keys as app env vars
        run: |
          eval "$(pnpm exec supabase status -o env | tr -d '"' | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=')"
          {
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "GEMINI_API_KEY=ci-dummy-key-no-e2e-run-may-reach-the-real-api"
            echo "GEMINI_TIER=free"
            echo "ENRICH_MONTHLY_BUDGET_USD=5"
            echo "ASSISTANT_MONTHLY_BUDGET_USD=5"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_API_URL=http://127.0.0.1:3001"
          } >> "$GITHUB_ENV"

      # NEXT_PUBLIC_* is inlined at build time, so this must run AFTER the step above.
      - name: Build web and api
        run: pnpm turbo run build --filter=@cortex/web --filter=@cortex/api

      # The `exit 1` is load-bearing. The old loop ended on `sleep 2`, so the step's exit status
      # was the sleep's -- zero -- and a boot that never happened was reported as a GREEN
      # "Start the API" that merely took the full 60s. The failure then surfaced two steps later
      # as `[seed] fetch failed`, pointing at the seed script instead of at the API.
      - name: Start the API
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/health && exit 0
            sleep 2
          done
          echo "::error::the API never answered /health -- see the boot output above"
          exit 1
        env:
          PORT: 3001
          CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000

      # Keyed on the lockfile, which is what pins the Playwright version, which in turn pins the
      # browser build. Restoring browsers for a different Playwright version fails at launch
      # with "Executable doesn't exist", so a looser key would be worse than no cache.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Runs even on a cache hit: the cache restores browser binaries but not the apt libraries
      # they link against, and --with-deps is a no-op when both are already present.
      - name: Install Chromium
        run: pnpm --filter @cortex/web exec playwright install --with-deps chromium

      - name: Seed the E2E user and corpus
        run: node e2e/scripts/seed.mjs --reset

      # globalSetup signs in and writes both the cookies and the access token under
      # apps/web/e2e/.auth/, so nothing else has to be threaded through the environment here.
      - name: Run Playwright
        run: pnpm --filter @cortex/web exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
